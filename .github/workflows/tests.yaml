name: Tests

# Single required check. Skips (still reporting success) only when every changed
# file is on the ignore list in scripts/ci-test-gate.mjs; always runs on main.

on:
    pull_request:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Decide whether the changed files can affect tests
              id: gate
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: node scripts/ci-test-gate.mjs

            - name: Install
              if: steps.gate.outputs.run == 'true'
              run: yarn install --immutable

            - name: Build kit
              if: steps.gate.outputs.run == 'true'
              run: yarn kit:build

            - name: Test
              if: steps.gate.outputs.run == 'true'
              run: yarn test:coverage

            - name: Coverage summary
              if: always() && steps.gate.outputs.run == 'true'
              run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

    e2e:
        name: E2E
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Decide whether the changed files can affect tests
              id: gate
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: node scripts/ci-test-gate.mjs

            - name: Start thor-solo
              if: steps.gate.outputs.run == 'true'
              working-directory: thor-solo
              run: docker compose -f docker-compose.yaml up -d --wait thor-solo

            - name: Install
              if: steps.gate.outputs.run == 'true'
              run: yarn install --immutable

            - name: Build kit and example for thor-solo
              if: steps.gate.outputs.run == 'true'
              env:
                  NEXT_PUBLIC_NETWORK_TYPE: solo
              run: yarn kit:build && yarn workspace next-template build

            - name: Install Chromium
              if: steps.gate.outputs.run == 'true'
              run: yarn workspace vechain-kit-e2e install-browsers

            - name: Run E2E
              if: steps.gate.outputs.run == 'true'
              env:
                  CI: 'true'
              run: yarn test:e2e --project solo

            - name: Upload Playwright report
              if: failure() && steps.gate.outputs.run == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-report
                  path: tests/e2e/playwright-report
                  retention-days: 7

    e2e-testnet:
        name: E2E (testnet)
        runs-on: ubuntu-24.04
        environment: e2e-test
        permissions:
            contents: read
            pull-requests: write # updates the results comment on the PR
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Decide whether the changed files can affect tests
              id: gate
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: node scripts/ci-test-gate.mjs

            # Fork and Dependabot PRs get no environment secrets.
            - name: Check for Privy test credentials
              id: creds
              if: steps.gate.outputs.run == 'true'
              env:
                  E2E_PRIVY_APP_ID: ${{ secrets.E2E_PRIVY_APP_ID }}
                  E2E_PRIVY_TEST_EMAIL: ${{ secrets.E2E_PRIVY_TEST_EMAIL }}
                  E2E_PRIVY_TEST_CODE: ${{ secrets.E2E_PRIVY_TEST_CODE }}
              run: |
                  if [ -n "$E2E_PRIVY_APP_ID" ] && [ -n "$E2E_PRIVY_TEST_EMAIL" ] && [ -n "$E2E_PRIVY_TEST_CODE" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                      echo "Testnet E2E skipped: the e2e-test environment secrets are not available to this run." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Install
              if: steps.creds.outputs.run == 'true'
              run: yarn install --immutable

            - name: Build kit and example for testnet
              if: steps.creds.outputs.run == 'true'
              env:
                  NEXT_PUBLIC_NETWORK_TYPE: test
                  NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.E2E_PRIVY_APP_ID }}
                  NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ secrets.E2E_PRIVY_CLIENT_ID }}
              run: yarn kit:build && yarn workspace next-template build

            - name: Install Chromium
              if: steps.creds.outputs.run == 'true'
              run: yarn workspace vechain-kit-e2e install-browsers

            - name: Run testnet E2E
              if: steps.creds.outputs.run == 'true'
              env:
                  CI: 'true'
                  E2E_PRIVY_TEST_EMAIL: ${{ secrets.E2E_PRIVY_TEST_EMAIL }}
                  E2E_PRIVY_TEST_CODE: ${{ secrets.E2E_PRIVY_TEST_CODE }}
              run: yarn test:e2e --project testnet

            - name: Comment results
              if: always() && steps.creds.outputs.run == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                      node scripts/e2e-testnet-comment.mjs tests/e2e/test-results/results.json > "$RUNNER_TEMP/comment.md"
                  cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
                  [ -n "$PR_NUMBER" ] || exit 0
                  id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                      --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- e2e-testnet -->"))) | .id' | head -n 1)
                  if [ -n "$id" ]; then
                      gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
                  else
                      gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
                  fi

            - name: Upload Playwright report
              if: failure() && steps.creds.outputs.run == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-report-testnet
                  path: tests/e2e/playwright-report
                  retention-days: 7
